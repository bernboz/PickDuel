services:

  postgres:
    image: postgres:17
    container_name: pickduel-postgres
    restart: always

    environment:
      POSTGRES_DB: PickDuel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - pickduel-postgres-data:/var/lib/postgresql/data


volumes:

  pickduel-postgres-data: